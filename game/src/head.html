/* ===== UI refresh: modern, clean, still friendly ===== */
:root { --head: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Ubuntu", sans-serif; --body: "Segoe UI", system-ui, -apple-system, "Ubuntu", Verdana, sans-serif; --radius: 16px; }
body { font-size: 14px; }
.overlay { background: rgba(12, 22, 38, .42) !important; backdrop-filter: blur(4px); }
.panel { border-radius: var(--radius) !important; border: 1px solid rgba(120, 150, 190, .35) !important; box-shadow: 0 24px 60px -12px rgba(8, 24, 52, .45), 0 2px 6px rgba(8, 24, 52, .12) !important; }
.panel .bar { background: linear-gradient(120deg, var(--blue), color-mix(in srgb, var(--blue) 72%, #0b1f3a)) !important; text-shadow: none !important; font: 650 15px var(--head) !important; padding: 11px 16px !important; letter-spacing: .01em; }
.bar .dots i { width: 10px !important; height: 10px !important; background: rgba(255,255,255,.35) !important; border: none !important; }
.btn { border-radius: 12px !important; text-shadow: none !important; font-weight: 650 !important; letter-spacing: .01em; border: 1px solid color-mix(in srgb, var(--c) 70%, #000) !important;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 88%, #fff), var(--c)) !important; box-shadow: 0 6px 14px -6px color-mix(in srgb, var(--c) 70%, #000), inset 0 1px 0 rgba(255,255,255,.35) !important; transition: transform .12s, box-shadow .12s, filter .12s !important; }
.btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
.btn:active { transform: translateY(1px); }

.tabs { gap: 4px !important; padding: 8px 10px 0 !important; }
