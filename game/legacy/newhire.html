<title>New Hire Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap">
<style>
/* Layout: 2010 glossy desktop sim. Title → lobby (building directory) → shift (inbox + task window + mentor) → review. Single light look by choice. */
:root {
  color-scheme: light;
  --sky-top: #bfe3ff; --sky-bot: #5ea9ea;
  --ink: #1d3550; --ink-soft: #4d6681;
  --panel: #ffffff; --panel-2: #eef6fd; --edge: #9cc4e8;
  --blue: #2a7fd4; --blue-dark: #1b5ea6;
  --go: #5fb320; --go-dark: #3d7d0f;
  --warn: #f08a12; --bad: #d6342c; --ok: #2f9e2f; --gold: #f5b800;
  --head: "Ubuntu", "Trebuchet MS", "Lucida Grande", sans-serif;
  --body: Verdana, Tahoma, "DejaVu Sans", Geneva, sans-serif;
  --mono: Consolas, "Lucida Console", "Courier New", monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; color: var(--ink); font: 13px/1.55 var(--body);
  background: radial-gradient(ellipse at 50% -10%, rgba(255,255,255,.85), rgba(255,255,255,0) 55%), linear-gradient(var(--sky-top), var(--sky-bot)) fixed; background-color: var(--sky-bot); }
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap { padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1180px; margin: 0 auto; }
h1, h2, h3, h4 { font-family: var(--head); margin: 0; }

/* glossy kit */
.btn { --c: var(--blue); --cd: var(--blue-dark); font: 700 14px var(--head); color: #fff; text-shadow: 0 -1px 0 rgba(0,0,0,.35); cursor: pointer;
  border: 1px solid var(--cd); border-radius: 999px; padding: 8px 20px;
  background: linear-gradient(rgba(255,255,255,.5), rgba(255,255,255,.15) 49%, rgba(255,255,255,0) 50%), var(--c);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 2px 4px rgba(0,30,70,.3); transition: transform .08s, filter .15s; }
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: translateY(1px); }
.btn.go { --c: var(--go); --cd: var(--go-dark); }
.btn.orange { --c: var(--warn); --cd: #b05f00; }
.btn.grey { --c: #8a9bb0; --cd: #63748a; }
.btn.big { font-size: 19px; padding: 12px 34px; }
.btn.sm { font-size: 12px; padding: 5px 13px; }
.btn:disabled { filter: grayscale(.8) opacity(.6); cursor: default; }
.panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; box-shadow: 0 4px 14px rgba(0,40,90,.25); overflow: hidden; }
.bar { font: 700 14px var(--head); color: #fff; text-shadow: 0 -1px 0 rgba(0,0,0,.35); padding: 7px 12px; display: flex; align-items: center; gap: 8px;
  background: linear-gradient(rgba(255,255,255,.45), rgba(255,255,255,.1) 50%, rgba(0,0,0,0) 51%), var(--blue); border-bottom: 1px solid var(--blue-dark); }
.bar .dots { margin-left: auto; display: flex; gap: 5px; }
.bar .dots i { width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(#fff9, #fff3); border: 1px solid rgba(0,0,0,.25); }
.meter { height: 14px; border-radius: 7px; background: linear-gradient(#cfd9e4, #e8eef4); border: 1px solid #93a8bd; overflow: hidden; }
.meter i { display: block; height: 100%; transition: width .5s;
  background: linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,.1) 50%, rgba(0,0,0,0) 51%), repeating-linear-gradient(45deg, rgba(255,255,255,.18) 0 6px, transparent 6px 12px), var(--c, var(--go)); }
.chip { display: inline-block; font: 700 11px var(--head); padding: 2px 9px; border-radius: 999px; color: #fff; background: var(--c, var(--blue)); text-shadow: 0 -1px 0 rgba(0,0,0,.25); vertical-align: middle; }
.small { font-size: 11px; color: var(--ink-soft); }

/* title */
.title-screen { min-height: 100vh; display: grid; place-items: center; position: relative; overflow: hidden; padding: 30px 16px; }
.rays { position: absolute; inset: -50%; background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.22) 0 9deg, rgba(255,255,255,0) 9deg 18deg); animation: spin 90s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.title-card { position: relative; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; max-width: 640px; }
.logo { font: 700 clamp(48px, 11vw, 96px)/.9 var(--head); color: #fff; letter-spacing: -.02em;
  text-shadow: 0 2px 0 #1b5ea6, 0 4px 0 #174f8c, 0 6px 0 #12416f, 0 10px 18px rgba(0,30,70,.45); }
.logo-sub { font: 700 clamp(16px, 3.4vw, 24px) var(--head); color: #fff; letter-spacing: .3em; background: linear-gradient(rgba(255,255,255,.4), rgba(255,255,255,0) 50%), var(--warn); padding: 6px 18px 6px 24px; border-radius: 8px; border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,.25); transform: rotate(-2deg); }
.burst { position: absolute; right: -120px; top: -50px; width: 120px; height: 120px; display: grid; place-items: center; text-align: center; font: 700 15px/1.1 var(--head); color: #6b3a00;
  background: var(--gold); clip-path: polygon(50% 0, 61% 12%, 77% 6%, 79% 22%, 95% 25%, 88% 40%, 100% 50%, 88% 60%, 95% 75%, 79% 78%, 77% 94%, 61% 88%, 50% 100%, 39% 88%, 23% 94%, 21% 78%, 5% 75%, 12% 60%, 0 50%, 12% 40%, 5% 25%, 21% 22%, 23% 6%, 39% 12%); animation: wob 2.4s ease-in-out infinite; }
@keyframes wob { 50% { transform: rotate(8deg) scale(1.06); } }
.title-card p { margin: 0; color: #fff; font-size: 15px; text-shadow: 0 1px 2px rgba(0,40,90,.6); max-width: 52ch; }
.title-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

/* create */
.create { max-width: 760px; margin: 30px auto; }
.create-body { padding: 20px; display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 22px; }
.av-preview { background: linear-gradient(#e7f3ff, #c6e1fb); border: 1px solid var(--edge); border-radius: 12px; display: grid; place-items: center; padding: 14px; align-self: start; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.field label, .lbl { font: 700 12px var(--head); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }
input[type=text], textarea, select { font: 14px var(--body); color: var(--ink); background: #fff; border: 1px solid #8fb2d4; border-radius: 6px; padding: 8px 10px; box-shadow: inset 0 2px 3px rgba(0,30,70,.12); width: 100%; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #8fb2d4, 0 2px 3px rgba(0,0,0,.2); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--gold), 0 2px 3px rgba(0,0,0,.2); }
.seg { display: inline-flex; border: 1px solid var(--blue-dark); border-radius: 999px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: none; font: 700 12px var(--head); padding: 7px 13px; cursor: pointer; color: var(--ink); background: linear-gradient(#fff, #dde9f5); border-right: 1px solid #a9c3dc; }
.seg button:last-child { border-right: none; }
.seg button[aria-pressed="true"] { color: #fff; text-shadow: 0 -1px 0 rgba(0,0,0,.3); background: linear-gradient(rgba(255,255,255,.4), rgba(255,255,255,.05) 50%, rgba(0,0,0,0) 51%), var(--blue); }

/* lobby */
.lobby-top { display: flex; align-items: center; gap: 14px; padding: 12px 16px; flex-wrap: wrap; }
.lobby-top .who { display: flex; align-items: center; gap: 12px; }
.lobby-top .who b { font: 700 18px var(--head); display: block; }
.lobby-stats { margin-left: auto; display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
.stat-k { font: 700 10px var(--head); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); display: block; }
.stat-v { font: 700 18px var(--head); font-variant-numeric: tabular-nums; }
.money { color: var(--ok); }
.hq { margin: 22px 0 12px; display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hq h2 { font-size: 28px; color: #fff; text-shadow: 0 2px 0 var(--blue-dark), 0 4px 8px rgba(0,30,70,.4); }
.hq p { margin: 2px 0 0; color: #fff; text-shadow: 0 1px 2px rgba(0,40,90,.6); }
.diff-box { background: rgba(255,255,255,.85); border: 1px solid var(--edge); border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; gap: 5px; }
.depts { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 14px; }
.dept { display: flex; flex-direction: column; }
.dept-head { display: flex; gap: 12px; padding: 12px; align-items: center; border-bottom: 1px solid #dbe8f4; background: linear-gradient(#fff, #f0f7fe); }
.tile { --c: var(--blue); width: 52px; height: 52px; flex: none; border-radius: 12px; display: grid; place-items: center; border: 1px solid rgba(0,0,0,.25);
  background: linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,.12) 50%, rgba(0,0,0,0) 51%), var(--c); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 2px 4px rgba(0,0,0,.25); }
.tile svg { width: 28px; height: 28px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 0 rgba(0,0,0,.3)); }
.dept-head .floor { font: 700 10px var(--head); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-soft); }
.dept-head h3 { font-size: 17px; line-height: 1.15; }
.dept-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.dept-body .role { font-weight: 700; }
.stars { color: var(--gold); letter-spacing: 2px; font-size: 14px; text-shadow: 0 1px 0 #a87b00; }
.stars .off { color: #c9d4df; text-shadow: none; }
.dept-btns { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; flex-wrap: wrap; }
.dept.soon { border-style: dashed; background: rgba(255,255,255,.55); box-shadow: none; display: grid; place-items: center; text-align: center; padding: 20px; color: var(--ink-soft); min-height: 200px; }

/* shift */
.hud { display: flex; align-items: center; gap: 16px; padding: 9px 14px; flex-wrap: wrap; }
.hud .who { display: flex; gap: 10px; align-items: center; min-width: 0; }
.hud .who b { font: 700 15px var(--head); display: block; }
.hud .grow { flex: 1 1 160px; min-width: 140px; }
.clock { font: 700 22px var(--mono); color: #0d3b66; background: linear-gradient(#e9f5d8, #c6e3a2); border: 1px solid #7aa64b; border-radius: 6px; padding: 2px 10px; box-shadow: inset 0 2px 3px rgba(0,0,0,.15); font-variant-numeric: tabular-nums; }
.shift { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 14px; margin-top: 14px; align-items: start; }
.inbox ul { list-style: none; margin: 0; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.inbox li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; padding: 8px; border-radius: 6px; font-size: 12px; border: 1px solid transparent; }
.inbox li.cur { background: linear-gradient(#fff6d6, #ffe9a3); border-color: #e3c25c; }
.inbox li .ic { font-weight: 700; text-align: center; }
.inbox li.ok .ic { color: var(--ok); } .inbox li.fail .ic { color: var(--bad); }
.inbox li.urgent { border-color: var(--bad); }
.inbox li b { display: block; font-family: var(--head); font-size: 13px; line-height: 1.25; overflow-wrap: anywhere; }
.inbox li.locked { opacity: .5; }
.win-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.from { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.from b { font-family: var(--head); font-size: 15px; }
.from .timer { margin-left: auto; font: 700 16px var(--mono); color: var(--bad); }
.msg-text { font-size: 14px; max-width: 70ch; }
.msg-text p { margin: 0 0 8px; }
.doc { border: 1px solid #e3c25c; background: #fffbea; border-radius: 8px; }
.doc summary { cursor: pointer; padding: 7px 12px; font: 700 13px var(--head); color: #7a5a00; }
.doc .doc-in { padding: 4px 14px 12px; font-size: 13px; overflow-x: auto; }
.doc table, .tbl { border-collapse: collapse; font-size: 12.5px; }
.doc td, .doc th, .tbl td, .tbl th { border: 1px solid #e0d39a; padding: 4px 9px; text-align: left; }
.doc th { background: #fff2c2; }
pre.code { font: 12.5px/1.5 var(--mono); background: #1e2b3a; color: #e6f1ff; border-radius: 6px; padding: 10px 12px; overflow-x: auto; margin: 0; }
code { font-family: var(--mono); background: #e8f1fa; padding: 0 4px; border-radius: 3px; font-size: .95em; }
.ask { font: 700 15px var(--head); color: var(--blue-dark); }
.foot { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; border-top: 1px solid #dbe8f4; padding: 12px 16px; background: var(--panel-2); }
.foot .warn { color: var(--bad); font-weight: 700; font-size: 12px; }

/* widgets */
.opts, .rows { display: flex; flex-direction: column; gap: 7px; }
.opt { text-align: left; font: 13.5px/1.45 var(--body); color: var(--ink); cursor: pointer; padding: 10px 12px; border-radius: 8px; border: 1px solid #b7cde3; background: linear-gradient(#fff, #edf4fb); display: flex; gap: 10px; align-items: flex-start; }
.opt:hover:not(:disabled) { border-color: var(--blue); }
.opt .box { flex: none; width: 16px; height: 16px; margin-top: 1px; border: 2px solid #6d8cab; border-radius: 50%; background: #fff; }
.opt.multi .box { border-radius: 3px; }
.opt.sel { border-color: var(--blue); background: linear-gradient(#f2f9ff, #d6eafc); }
.opt.sel .box { background: var(--blue); border-color: var(--blue-dark); box-shadow: inset 0 0 0 2px #fff; }
.opt.right { border-color: var(--ok); background: linear-gradient(#f3fff0, #d7f2cc); }
.opt.wrong { border-color: var(--bad); background: linear-gradient(#fff4f3, #fbd6d3); }
.opt.missed { border-color: var(--ok); border-style: dashed; }
.orow { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid #b7cde3; border-radius: 8px; background: linear-gradient(#fff, #edf4fb); }
.orow .n { font: 700 13px var(--head); width: 22px; height: 22px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; flex: none; }
.orow .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.orow .mv { display: flex; gap: 4px; }
.orow .mv button { width: 30px; height: 28px; border-radius: 6px; border: 1px solid #8fb2d4; background: linear-gradient(#fff, #dde9f5); cursor: pointer; font-size: 11px; color: var(--ink); }
.orow.right { border-color: var(--ok); } .orow.wrong { border-color: var(--bad); }
.srow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid #b7cde3; border-radius: 8px; background: #fff; flex-wrap: wrap; }
.srow .t { flex: 1 1 220px; min-width: 0; }
.srow.right { border-color: var(--ok); background: #f3fff0; } .srow.wrong { border-color: var(--bad); background: #fff4f3; }
.mrow { display: grid; grid-template-columns: minmax(80px, 1fr) minmax(0, 2fr); gap: 10px; align-items: center; padding: 6px 8px; border: 1px solid #b7cde3; border-radius: 8px; background: #fff; }
.mrow b { font-family: var(--head); }
.mrow.right { border-color: var(--ok); } .mrow.wrong { border-color: var(--bad); }
.ifields { display: flex; flex-wrap: wrap; gap: 12px; }
.ifield { flex: 1 1 200px; display: flex; flex-direction: column; gap: 4px; }
.ifield .in { display: flex; align-items: center; gap: 6px; }
.ifield.right input { border-color: var(--ok); } .ifield.wrong input { border-color: var(--bad); }
.term { background: #0c0c0c; color: #d7d7d7; border-radius: 6px; border: 2px solid #5a6b7d; font: 13px/1.45 var(--mono); height: 300px; display: flex; flex-direction: column; cursor: text; }
.tout { flex: 1; overflow: auto; padding: 10px 12px 4px; white-space: pre-wrap; word-break: break-word; }
.tline { display: flex; gap: 6px; padding: 2px 12px 10px; }
.tline input { flex: 1; min-width: 0; background: none; border: none; color: #fff; font: 13px var(--mono); outline: none; padding: 0; }
.tp { color: #9fe870; white-space: nowrap; }
.t-err { color: #ff8a80; } .t-ok { color: #9fe870; } .t-dim { color: #8a8a8a; }
.editor { font: 13px/1.55 var(--mono); min-height: 220px; white-space: pre; tab-size: 2; resize: vertical; background: #1e2b3a; color: #e6f1ff; border-color: #0e1a26; }
.tests { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; font: 12px var(--mono); }
.tests li { padding: 5px 9px; border-radius: 5px; background: #f1f5f9; overflow-wrap: anywhere; }
.tests li.p { color: var(--ok); } .tests li.f { color: var(--bad); }

/* result */
.result { border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; animation: pop .35s cubic-bezier(.2, 1.5, .4, 1); }
@keyframes pop { from { transform: scale(.92); opacity: 0; } }
.result.good { background: linear-gradient(#f0ffe8, #d2f2c2); border: 2px solid var(--ok); }
.result.bad { background: linear-gradient(#fff2f0, #fcd5d0); border: 2px solid var(--bad); }
.result h3 { font-size: 20px; }
.result.good h3 { color: var(--ok); } .result.bad h3 { color: var(--bad); }
.lesson { background: #fff; border: 1px solid #e3c25c; border-left: 5px solid var(--gold); border-radius: 6px; padding: 8px 12px; }
.lesson b { font-family: var(--head); color: #7a5a00; }

/* mentor */
.mentor { display: flex; gap: 12px; align-items: flex-end; margin-top: 14px; }
.bubble { position: relative; background: #fff; border: 2px solid var(--edge); border-radius: 14px; padding: 10px 14px; font-size: 13.5px; box-shadow: 0 3px 8px rgba(0,40,90,.2); flex: 1; min-width: 0; }
.bubble::before { content: ""; position: absolute; left: -11px; bottom: 14px; border: 10px solid transparent; border-right-color: var(--edge); border-left: 0; }
.bubble b.name { font-family: var(--head); color: var(--blue-dark); }
.av { flex: none; border-radius: 50%; display: block; }

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 30; background: rgba(10, 40, 80, .55); display: grid; place-items: center; padding: 16px; }
.modal { max-width: 560px; width: 100%; max-height: 90vh; display: flex; flex-direction: column; }
.modal .m-body { padding: 18px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.notif { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 25; width: min(330px, calc(100% - 32px)); transform: translateY(160%); transition: transform .4s cubic-bezier(.2, 1.4, .4, 1); }
.notif.show { transform: none; }
.notif .bar { background: linear-gradient(rgba(255,255,255,.45), rgba(255,255,255,.1) 50%, rgba(0,0,0,0) 51%), var(--bad); border-color: #8f1d17; }
.notif .n-body { padding: 10px 12px; font-size: 13px; }
.floaty { position: fixed; z-index: 40; font: 700 18px var(--head); pointer-events: none; animation: floatUp 1.2s ease-out forwards; text-shadow: 0 1px 0 #fff, 0 0 6px #fff; }
@keyframes floatUp { to { transform: translateY(-50px); opacity: 0; } }
.review { max-width: 620px; margin: 24px auto; }
.stamp { font: 700 clamp(26px, 6vw, 40px) var(--head); color: var(--ok); border: 4px solid currentColor; border-radius: 10px; padding: 4px 16px; display: inline-block; transform: rotate(-3deg); animation: stampIn .45s cubic-bezier(.2, 1.6, .4, 1); }
.stamp.badday { color: var(--bad); }
@keyframes stampIn { from { transform: rotate(-3deg) scale(2.2); opacity: 0; } }
.rv-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
.rv-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.rv-table td { padding: 7px 10px; border-bottom: 1px solid #dbe8f4; text-align: left; }
.rv-table td:last-child { text-align: right; font: 700 15px var(--head); font-variant-numeric: tabular-nums; }
.promo { background: linear-gradient(rgba(255,255,255,.5), rgba(255,255,255,0) 50%), var(--gold); color: #5a3a00; font: 700 18px var(--head); padding: 10px 18px; border-radius: 10px; border: 2px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,.2); }
.lessons { text-align: left; width: 100%; display: flex; flex-direction: column; gap: 6px; }
.taskbar { position: sticky; bottom: 0; margin-top: 18px; display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 10px; color: #fff; font: 700 12px var(--head);
  background: linear-gradient(rgba(255,255,255,.3), rgba(255,255,255,.05) 50%, rgba(0,0,0,.05) 51%), #1f3b5c; border: 1px solid #0f2238; box-shadow: 0 -2px 10px rgba(0,0,0,.2); }
.orb { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 50% 30%, #bff27a, #4f9a14 60%, #2c5e06); border: 1px solid #1c3d02; box-shadow: inset 0 1px 0 rgba(255,255,255,.6); }
.taskbar .tclock { margin-left: auto; font-family: var(--mono); }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

@media (max-width: 820px) {
  .shift { grid-template-columns: minmax(0, 1fr); }
  .inbox ul { flex-direction: row; overflow-x: auto; }

<script>
(() => {
"use strict";
/* =====================================================================
   NEW HIRE SIMULATOR
   Engine first, job content after. To add a job, add one object to the
   JOBS array (see the template comment above JOBS). Task types available:
     choice  - pick one option            multi - select all that apply
     order   - put steps in order         input - type number/text answers
     match   - match pairs                sort  - put items into buckets
     code    - write a JS function        terminal - fake command line
   ===================================================================== */

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const money = n => "$" + Math.round(n).toLocaleString();

/* ---------- save ---------- */
const KEY = "new-hire-sim.v1";
let S = { player: null, jobs: {}, money: 0, muted: false, diff: "normal" };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const jobState = id => (S.jobs[id] = S.jobs[id] || { xp: 0, days: 0, done: {}, lessons: {}, best: 0 });

/* ---------- rules ---------- */
const LEVELS = [
  { xp: 0, name: "Trainee", pay: 90 }, { xp: 60, name: "Junior", pay: 120 }, { xp: 150, name: "Associate", pay: 160 },
  { xp: 280, name: "Senior", pay: 210 }, { xp: 450, name: "Lead", pay: 280 }
];
const lvl = xp => LEVELS.filter(l => xp >= l.xp).length - 1;
const DIFF = {
  easy:   { name: "Intern",   tag: "Easy",   right: 8, wrong: -8,  hint: 0,  timer: 0,   urgent: 0,   curve: .25, pay: .8,  xp: .75, desc: "No timers, free mentor help, mistakes hurt less." },
  normal: { name: "Employee", tag: "Normal", right: 8, wrong: -15, hint: -4, timer: 0,   urgent: 120, curve: .5,  pay: 1,   xp: 1,   desc: "Urgent tasks have a 2-minute timer. Mentor help costs a little." },
  hard:   { name: "Overtime", tag: "Hard",   right: 7, wrong: -22, hint: -8, timer: 150, urgent: 75,  curve: .8,  pay: 1.4, xp: 1.5, desc: "Every task is timed, harder tasks show up sooner, mistakes hurt." }
};
const SHIFT_TASKS = 4;

/* ---------- sound ---------- */
const Sfx = {
  ctx: null,
  init() { try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === "suspended") this.ctx.resume(); } catch (e) {} },
  tone(f, d, type = "square", v = .04, t0 = 0, f2) {
    if (S.muted || !this.ctx) return;
    try { const c = this.ctx, t = c.currentTime + t0, o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .03); } catch (e) {}
  },
  click() { this.tone(1200, .03, "sine", .03); },
  key() { this.tone(600 + Math.random() * 400, .02, "square", .012); },
  ok() { [660, 880, 1320].forEach((f, i) => this.tone(f, .14, "triangle", .06, i * .07)); },
  bad() { this.tone(300, .12, "square", .05); this.tone(200, .25, "square", .05, .12); },
  alarm() { for (let i = 0; i < 3; i++) { this.tone(880, .12, "square", .04, i * .25); this.tone(660, .12, "square", .04, i * .25 + .12); } },
  cash() { [1046, 1318, 1568, 2093].forEach((f, i) => this.tone(f, .12, "sine", .05, i * .06)); this.tone(2637, .4, "sine", .04, .26); },
  promo() { [523, 659, 784, 1046, 784, 1046].forEach((f, i) => this.tone(f, .18, "triangle", .07, i * .12)); },
  tick() { this.tone(1800, .03, "sine", .025); }
};
document.addEventListener("pointerdown", () => Sfx.init());
document.addEventListener("keydown", e => { Sfx.init(); if (e.target.matches && e.target.matches(".tline input") && e.key.length === 1) Sfx.key(); });

/* ---------- avatars & icons ---------- */
const SKINS = ["#f6d7bd", "#e8b48f", "#c98e62", "#9a6440", "#6b4128"];
const HAIRS = ["#2b1d14", "#6b3e1f", "#c98b3c", "#e7d08a", "#8c8c8c", "#b4322a"];

function avatar(a, size = 48) {

  const styles = [
    `<path d="M19 28c-1-12 7-17 13-17s14 5 13 17c-2-6-6-9-13-9s-11 3-13 9z" fill="${hair}"/>`,
    `<path d="M18 40c-3-16 3-29 14-29s17 13 14 29l-4-1c1-8 0-15-10-17-10 2-11 9-10 17z" fill="${hair}"/>`,
    `<circle cx="24" cy="18" r="6" fill="${hair}"/><circle cx="32" cy="14" r="7" fill="${hair}"/><circle cx="40" cy="18" r="6" fill="${hair}"/><path d="M19 27c0-6 5-10 13-10s13 4 13 10c-3-4-7-5-13-5s-10 1-13 5z" fill="${hair}"/>`,
    `<path d="M20 24c2-8 8-11 12-11s10 3 12 11c-4-3-8-4-12-4s-8 1-12 4z" fill="${hair}"/>`

  return `<svg class="av" viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true"><circle cx="32" cy="32" r="32" fill="#d4ebff"/><ellipse cx="32" cy="18" rx="22" ry="10" fill="#fff" opacity=".35"/>
    <path d="M9 64c0-14 10-21 23-21s23 7 23 21z" fill="${shirt}"/><path d="M26 43l6 7 6-7z" fill="#fff"/><rect x="28" y="36" width="8" height="8" fill="${skin}"/>
    <circle cx="32" cy="28" r="13" fill="${skin}"/>${styles[a.style || 0] || styles[0]}
    <circle cx="27" cy="29" r="1.6" fill="#2a2a2a"/><circle cx="37" cy="29" r="1.6" fill="#2a2a2a"/><path d="M27 34q5 4 10 0" stroke="#7a3b2a" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>`;
}
const hashAv = name => { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return { skin: h % 5, hair: (h >> 3) % 6, shirt: (h >> 6) % 6, style: (h >> 9) % 4 }; };
const ICONS = {
  monitor: '<rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  code: '<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/>',
  truck: '<rect x="2" y="7" width="12" height="9"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  boxes: '<rect x="3" y="12" width="8" height="8"/><rect x="13" y="12" width="8" height="8"/><rect x="8" y="4" width="8" height="8"/>',
  chart: '<path d="M3 20h18M5 16l5-5 4 3 6-7"/><path d="M15 7h5v5"/>',
  calc: '<rect x="5" y="3" width="14" height="18" rx="2"/><rect x="8" y="6" width="8" height="4"/><path d="M8.5 14h.01M12 14h.01M15.5 14h.01M8.5 17.5h.01M12 17.5h.01M15.5 17.5h.01"/>',
  people: '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6M15 14c3 0 6 2 6 5"/>',
  case: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2M3 13h18"/>',
  headset: '<path d="M4 14v-2a8 8 0 0116 0v2"/><rect x="3" y="14" width="4" height="6" rx="1"/><rect x="17" y="14" width="4" height="6" rx="1"/><path d="M19 20c0 1-2 2-5 2"/>'
};
const icon = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k] || ICONS.case}</svg>`;

/* ---------- run player code ---------- */
function compile(code, names) {
  const ret = "\n;return {" + names.map(n => `${n}: (typeof ${n} !== "undefined" ? ${n} : undefined)`).join(",") + "};";
  try { return new Function(code + ret)(); }
  catch (e) {
    if (!(e instanceof EvalError) && !/unsafe-eval|Content Security|Refused/i.test(e.message)) throw e;
    window.__nhOut = undefined; window.__nhErr = undefined; let caught;
    const onErr = ev => { caught = ev.error || new Error(ev.message); ev.preventDefault(); };
    window.addEventListener("error", onErr);
    const s = document.createElement("script");
    s.textContent = `try{window.__nhOut=(function(){${code + ret}\n})();}catch(e){window.__nhErr=e;}`;
    document.head.appendChild(s); s.remove(); window.removeEventListener("error", onErr);
    if (caught) throw caught; if (window.__nhErr) throw window.__nhErr;
    if (!window.__nhOut) throw new Error("Your code could not run. Check for typos.");
    return window.__nhOut;
  }
}

/* =====================================================================
   WIDGETS: each returns { submit() -> {ok, msg} | {incomplete: "..."} }
   or { noSubmit: true } and calls ctx.finish(ok, msg) itself.
   ===================================================================== */
const W = {};
W.choice = (el, t) => {
  const opts = shuffle(t.options); let sel = -1;
  el.innerHTML = `<div class="opts">${opts.map((o, k) => `<button class="opt" type="button" data-k="${k}"><span class="box"></span><span>${o.t}</span></button>`).join("")}</div>`;
  $$(".opt", el).forEach(b => b.addEventListener("click", () => { sel = +b.dataset.k; $$(".opt", el).forEach(x => x.classList.toggle("sel", x === b)); Sfx.click(); }));
  return { submit() {
    if (sel < 0) return { incomplete: "Pick an answer first." };
    $$(".opt", el).forEach((b, k) => { b.disabled = true; if (opts[k].ok) b.classList.add("right"); else if (k === sel) b.classList.add("wrong"); });
    return { ok: !!opts[sel].ok, msg: opts[sel].fb || "" };
  } };
};
W.multi = (el, t) => {
  const items = shuffle(t.items); const sel = new Set();
  el.innerHTML = `<div class="opts">${items.map((o, k) => `<button class="opt multi" type="button" data-k="${k}"><span class="box"></span><span>${o.t}</span></button>`).join("")}</div><div class="small">Select all that apply.</div>`;
  $$(".opt", el).forEach(b => b.addEventListener("click", () => { const k = +b.dataset.k; sel.has(k) ? sel.delete(k) : sel.add(k); b.classList.toggle("sel"); Sfx.click(); }));
  return { submit() {
    if (!sel.size) return { incomplete: "Select at least one." };
    let missed = 0, extra = 0;
    $$(".opt", el).forEach((b, k) => { b.disabled = true; const o = items[k];
      if (o.ok && sel.has(k)) b.classList.add("right"); else if (o.ok) { b.classList.add("missed"); missed++; } else if (sel.has(k)) { b.classList.add("wrong"); extra++; } });
    const ok = !missed && !extra;
    return { ok, msg: ok ? "You caught every one." : `${missed ? `You missed ${missed} (dashed green). ` : ""}${extra ? `${extra} of your picks were wrong (red).` : ""}` };
  } };
};
W.order = (el, t) => {
  let cur = shuffle(t.items.map((_, i) => i));
  if (cur.every((v, i) => v === i)) cur.reverse();
  let locked = false;
  const draw = () => {
    el.innerHTML = `<div class="rows">${cur.map((idx, pos) => `<div class="orow" data-p="${pos}"><span class="n">${pos + 1}</span><span class="t">${t.items[idx]}</span>
      ${locked ? "" : `<span class="mv"><button type="button" data-d="-1" aria-label="Move up" ${pos === 0 ? "disabled" : ""}>▲</button><button type="button" data-d="1" aria-label="Move down" ${pos === cur.length - 1 ? "disabled" : ""}>▼</button></span>`}</div>`).join("")}</div>${locked ? "" : `<div class="small">Use the arrows to put the steps in order, first step at the top.</div>`}`;
    $$(".mv button", el).forEach(b => b.addEventListener("click", () => {
      const p = +b.closest(".orow").dataset.p, d = +b.dataset.d; [cur[p], cur[p + d]] = [cur[p + d], cur[p]]; Sfx.click(); draw();
      const btn = $(`.orow[data-p="${p + d}"] button[data-d="${d}"]`, el) || $(`.orow[data-p="${p + d}"] button`, el); if (btn) btn.focus();
    }));
  };
  draw();
  return { submit() {
    locked = true; const ok = cur.every((v, i) => v === i); draw();
    $$(".orow", el).forEach((r, i) => r.classList.add(cur[i] === i ? "right" : "wrong"));
    return { ok, msg: ok ? "Perfect order." : "The correct order is: " + t.items.map((s, i) => `<br>${i + 1}. ${s}`).join("") };
  } };
};
W.input = (el, t) => {
  el.innerHTML = `<div class="ifields">${t.fields.map((f, i) => `<div class="ifield"><label class="lbl" for="if${i}">${f.label}</label><div class="in">${f.prefix || ""}<input type="text" id="if${i}" autocomplete="off" inputmode="${typeof f.answer === "number" ? "decimal" : "text"}">${f.suffix || ""}</div></div>`).join("")}</div>`;
  const norm = s => String(s).toLowerCase().replace(/\s+/g, "").replace(/(am|pm)$/, "");
  return { submit() {
    const vals = t.fields.map((_, i) => $(`#if${i}`, el).value.trim());
    if (vals.some(v => !v)) return { incomplete: "Fill in every box first." };
    let ok = true;
    t.fields.forEach((f, i) => {
      let good;
      if (typeof f.answer === "number") { const v = parseFloat(vals[i].replace(/[^0-9.\-]/g, "")); good = !isNaN(v) && Math.abs(v - f.answer) <= (f.tol ?? .01); }
      else good = [].concat(f.answer).some(a => norm(a) === norm(vals[i]));
      $(`#if${i}`, el).disabled = true; $(`#if${i}`, el).closest(".ifield").classList.add(good ? "right" : "wrong"); ok = ok && good;
    });
    return { ok, msg: ok ? "Numbers check out." : "Correct answer" + (t.fields.length > 1 ? "s" : "") + ": " + t.fields.map(f => `${f.label}: <b>${f.prefix || ""}${typeof f.answer === "number" ? f.answer.toLocaleString() : [].concat(f.answer)[0]}${f.suffix || ""}</b>`).join(" · ") };
  } };
};
W.match = (el, t) => {
  const rights = shuffle(t.pairs.map(p => p[1]));
  el.innerHTML = `<div class="rows">${t.pairs.map((p, i) => `<div class="mrow"><b>${p[0]}</b><select id="mt${i}" aria-label="Match for ${esc(p[0])}"><option value="">Choose…</option>${rights.map(r => `<option>${esc(r)}</option>`).join("")}</select></div>`).join("")}</div>`;
  return { submit() {
    const vals = t.pairs.map((_, i) => $(`#mt${i}`, el).value);
    if (vals.some(v => !v)) return { incomplete: "Match every row first." };
    let ok = true;
    t.pairs.forEach((p, i) => { const g = vals[i] === p[1]; ok = ok && g; const s = $(`#mt${i}`, el); s.disabled = true; s.closest(".mrow").classList.add(g ? "right" : "wrong"); });
    return { ok, msg: ok ? "All matched." : "Correct matches: " + t.pairs.map(p => `<br><b>${p[0]}</b> → ${p[1]}`).join("") };
  } };
};
W.sort = (el, t) => {
  const items = shuffle(t.items); const pickd = items.map(() => -1);
  el.innerHTML = `<div class="rows">${items.map((it, i) => `<div class="srow" data-i="${i}"><span class="t">${it.t}</span><span class="seg" role="group">${t.buckets.map((b, j) => `<button type="button" data-j="${j}" aria-pressed="false">${b}</button>`).join("")}</span></div>`).join("")}</div>`;
  $$(".srow", el).forEach(r => $$("button", r).forEach(b => b.addEventListener("click", () => {
    pickd[+r.dataset.i] = +b.dataset.j; $$("button", r).forEach(x => x.setAttribute("aria-pressed", String(x === b))); Sfx.click();
  })));
  return { submit() {
    if (pickd.some(v => v < 0)) return { incomplete: "Sort every item first." };
    let wrong = [];
    $$(".srow", el).forEach((r, i) => { const g = pickd[i] === items[i].b; r.classList.add(g ? "right" : "wrong"); $$("button", r).forEach(x => x.disabled = true); if (!g) wrong.push(`<br>${items[i].t} → <b>${t.buckets[items[i].b]}</b>`); });
    return { ok: !wrong.length, msg: wrong.length ? `${wrong.length} misplaced:${wrong.join("")}` : "Everything is in the right place." };
  } };
};
W.code = (el, t) => {
  el.innerHTML = `<textarea class="editor" id="ed" spellcheck="false" autocapitalize="off" aria-label="Code editor">${esc(t.starter)}</textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn sm" type="button" id="runT">Run tests</button><span class="small">Test as much as you like. Submitting with failing tests ships a bug.</span></div><ul class="tests" id="tl"></ul>`;
  const ta = $("#ed", el);
  ta.addEventListener("keydown", e => { if (e.key === "Tab") { e.preventDefault(); ta.setRangeText("  ", ta.selectionStart, ta.selectionEnd, "end"); } });
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const run = () => {
    const tl = $("#tl", el); let fn;
    try { fn = compile(ta.value, [t.fn])[t.fn]; } catch (err) { tl.innerHTML = `<li class="f">✘ ${esc(err.name)}: ${esc(err.message)}</li>`; return 0; }
    if (typeof fn !== "function") { tl.innerHTML = `<li class="f">✘ Couldn't find a function named ${t.fn}.</li>`; return 0; }
    let pass = 0;
    tl.innerHTML = t.tests.map(ts => { let got, ok; try { got = fn(...JSON.parse(JSON.stringify(ts.args))); ok = same(got, ts.want); } catch (err) { got = err.message; ok = false; }
      if (ok) pass++; return `<li class="${ok ? "p" : "f"}">${ok ? "✔" : "✘"} ${t.fn}(${ts.args.map(a => esc(JSON.stringify(a))).join(", ")}) ${ok ? "" : `→ expected ${esc(JSON.stringify(ts.want))}, got ${esc(JSON.stringify(got))}`}</li>`; }).join("");
    Sfx.click(); return pass;
  };
  $("#runT", el).addEventListener("click", run);
  return { submit() { const p = run(); ta.readOnly = true; $("#runT", el).disabled = true;
    return p === t.tests.length ? { ok: true, msg: "All tests pass. Shipped!" } : { ok: false, msg: `Only ${p} of ${t.tests.length} tests passed, so you shipped a bug to production. Users noticed.` }; } };
};
W.terminal = (el, t, ctx) => {
  const st = {}; let done = false;
  el.innerHTML = `<div class="term"><div class="tout"></div><div class="tline"><span class="tp">${esc(t.prompt)}</span><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Command line"></div></div><div class="small">Type <b>help</b> to list commands. Up arrow repeats your last command.</div>`;
  const out = $(".tout", el), inp = $(".tline input", el); const hist = [];
  const print = (s, cls = "") => { out.insertAdjacentHTML("beforeend", `<span class="${cls}">${esc(s)}</span>\n`); out.scrollTop = out.scrollHeight; };
  print(t.intro || "", "t-dim");
  inp.addEventListener("keydown", e => {
    if (e.key === "ArrowUp" && hist.length) { e.preventDefault(); inp.value = hist[hist.length - 1]; return; }
    if (e.key !== "Enter" || done) return;
    const line = inp.value.trim(); inp.value = ""; if (!line) return; hist.push(line);
    print(t.prompt + " " + line);
    if (/^help$/i.test(line)) return print(t.help);
    if (/^(cls|clear)$/i.test(line)) { out.innerHTML = ""; return; }
    const c = t.commands.find(c => c.re.test(line));
    if (!c) return print(`'${line.split(" ")[0]}' is not a recognized command. Type help.`, "t-err");
    const r = c.run(line.match(c.re), st);
    if (typeof r === "string") return print(r);
    if (r.out) print(r.out, r.cls || "");
    if (r.fail) { done = true; inp.disabled = true; ctx.finish(false, r.fail); }
    if (r.win) { done = true; inp.disabled = true; print(r.winOut || "✔ Problem solved.", "t-ok"); ctx.finish(true, r.win); }
  });
  $(".term", el).addEventListener("click", () => inp.focus());
  return { noSubmit: true };
};

/* =====================================================================
   JOBS. Template for a new job:
   {
     id: "unique-id", dept: "Department name", floor: 12, icon: "case", color: "#hex",
     role: "Job Title", blurb: "One line about the job",
     mentor: { name: "Full Name", title: "Their title", hello: "First-day greeting" },
     tasks: [ { id, tier: 1-3, type, from: ["Name", "Team"], subject, msg, doc?: {title, html},
                ask, hint, lesson, curveball?: true, ...fields for the type } ]
   }
   ===================================================================== */
const JOBS = [];

/* ---------- IT ---------- */
JOBS.push({
  id: "it", dept: "IT Help Desk", floor: 3, icon: "monitor", color: "#2a7fd4", role: "IT Support Technician",
  blurb: "Fix computers, networks and printers for 400 coworkers.",
  mentor: { name: "Dana Okafor", title: "IT Lead", hello: "Welcome to the help desk, {name}! Tickets come in on the left. Read each one, check any attachments, and ask me if you get stuck. Everyone breaks something in their first week. Don't panic." },
  tasks: [
    { id: "it-slow", tier: 1, type: "choice", from: ["Greg Holt", "Accounting"], subject: "My computer is SO slow",
      msg: "Hi, my PC has been crawling all morning. Spreadsheets take forever to open. Can you fix it? I haven't restarted it in... maybe three weeks?",
      ask: "What do you try first?", hint: "Start with the simplest, fastest fix. He mentioned something about three weeks...",

    { id: "cy-threats", tier: 2, type: "match", from: ["Marcus Lee", "Security Lead"], subject: "Threat briefing",

    { id: "cy-alerts", tier: 3, type: "sort", from: ["Marcus Lee", "Security Lead"], subject: "Alert triage shift",

      buckets: ["Real threat", "False alarm"],

/* ---------- shift ---------- */
let SH = null;
function chooseTasks(job, js) {
  const maxTier = Math.min(3, lvl(js.xp) + 1 + (S.diff === "hard" ? 1 : 0));
  const pool = job.tasks.filter(t => !t.curveball).map(t => ({ t, score: (t.tier > maxTier ? 10 * (t.tier - maxTier) : 0) + (js.done[t.id] === "ok" ? 4 : js.done[t.id] === "fail" ? -1 : 0) + Math.random() * 3 }));
  return pool.sort((a, b) => a.score - b.score).slice(0, SHIFT_TASKS).map(x => x.t).sort((a, b) => a.tier - b.tier);
}
function startShift(id) {
  const job = jobById(id), js = jobState(id);
  SH = { job, js, diff: DIFF[S.diff], queue: chooseTasks(job, js).map(t => ({ t, urgent: false })), i: 0, perf: 70, results: [], xp: 0, bonus: 0, curveDone: false, timer: null, sentHome: false };
  renderShift();
  mentorSay(job.mentor.hello.replace(/\{name\}/g, S.player.name.split(" ")[0]) + (js.days === 0 ? " This is your first day, so we'll start you on the basics." : ""));
}
const clockFor = i => { const total = Math.max(SH.queue.length, 1); const mins = 9 * 60 + Math.round(i / total * 8 * 60); const h = Math.floor(mins / 60), m = mins % 60; return `${((h + 11) % 12) + 1}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`; };

function renderShift() {
  const { job, js } = SH;

    <div class="panel hud"><div class="who">${avatar(S.player.av, 44)}<div><b>${esc(S.player.name)}</b><span class="small">${titleFor(job, js.xp)} · Day ${js.days + 1}</span></div></div>
      <div class="clock" id="clk">${clockFor(SH.i)}</div>
      <div class="grow"><span class="stat-k">Performance <span id="perfN">${SH.perf}%</span></span><div class="meter"><i id="perfBar" style="width:${SH.perf}%"></i></div></div>
      <div><span class="stat-k">XP today</span><span class="stat-v" id="xpN">+${SH.xp}</span></div>
      <span class="chip" style="--c:${S.diff === "hard" ? "var(--bad)" : S.diff === "easy" ? "var(--ok)" : "var(--blue)"}">${SH.diff.name}</span>
      <button class="btn grey sm" type="button" id="quit">Leave shift</button></div>
    <div class="shift">
      <div class="panel inbox"><div class="bar" style="--blue:${job.color}">${job.dept} inbox</div><ul id="inbox"></ul></div>
      <div><div class="panel" id="win"></div>
        <div class="mentor">${avatar(hashAv(job.mentor.name), 64)}<div class="bubble" id="bub" aria-live="polite"></div></div></div>
    </div>
    <div class="taskbar"><span class="orb" aria-hidden="true"></span><span>${job.dept}: ${SH.queue.length} tasks today</span><span class="tclock" id="tclk">${clockFor(SH.i)}</span></div>
  </div>`;
  $("#quit").addEventListener("click", () => {
    const b = $("#quit");
    if (b.dataset.armed) { clearInterval(SH.timer); SH = null; showLobby(); return; }
    b.dataset.armed = "1"; b.textContent = "Click again: leave without pay"; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = "Leave shift"; } }, 3500);
  });
  drawInbox(); openTask();
}
function drawInbox() {
  $("#inbox").innerHTML = SH.queue.map((q, k) => {
    const r = SH.results[k]; const cls = [k === SH.i && !r ? "cur" : "", r ? (r.ok ? "ok" : "fail") : "", q.urgent ? "urgent" : "", k > SH.i ? "locked" : ""].join(" ");
    return `<li class="${cls}"><span class="ic">${r ? (r.ok ? "✔" : "✘") : k === SH.i ? "▶" : "•"}</span><span><b>${q.t.subject}</b>${q.urgent ? '<span class="chip" style="--c:var(--bad)">URGENT</span> ' : ""}<span class="small">${q.t.from[0]}</span></span></li>`;
  }).join("");
}
function mentorSay(text) { const b = $("#bub"); if (!b) return; b.innerHTML = `<b class="name">${SH.job.mentor.name.split(" ")[0]}:</b> ${text}`; }
function floaty(txt, color, anchor) {
  const r = (anchor || $("#perfBar")).getBoundingClientRect();
  const f = document.createElement("div"); f.className = "floaty"; f.textContent = txt; f.style.color = color;
  f.style.left = (r.left + r.width / 2 - 20) + "px"; f.style.top = (r.top - 10) + "px";
  document.body.appendChild(f); setTimeout(() => f.remove(), 1300);
}
function setPerf(delta) {
  SH.perf = Math.max(0, Math.min(100, SH.perf + delta));
  $("#perfN").textContent = SH.perf + "%"; const bar = $("#perfBar"); bar.style.width = SH.perf + "%";
  bar.style.setProperty("--c", SH.perf < 35 ? "var(--bad)" : SH.perf < 60 ? "var(--warn)" : "var(--go)");
  if (delta) floaty((delta > 0 ? "+" : "") + delta + "%", delta > 0 ? "var(--ok)" : "var(--bad)");
}

function openTask() {
  clearInterval(SH.timer);
  const q = SH.queue[SH.i]; const t = q.t; const job = SH.job;
  const limit = q.urgent ? (SH.diff.urgent || 0) : (SH.diff.timer || 0);
  const hintCost = SH.diff.hint;
  $("#clk").textContent = $("#tclk").textContent = clockFor(SH.i);
  const win = $("#win");
  win.innerHTML = `<div class="bar" style="--blue:${q.urgent ? "var(--bad)" : job.color}">${q.urgent ? "URGENT: " : ""}${t.subject}<span class="dots"><i></i><i></i><i></i></span></div>
    <div class="win-body">
      <div class="from">${avatar(hashAv(t.from[0]), 40)}<div><b>${t.from[0]}</b><div class="small">${t.from[1]} · ${"●".repeat(t.tier)}${"○".repeat(3 - t.tier)} difficulty</div></div>${limit ? `<span class="timer" id="tmr">${limit}s</span>` : ""}</div>
      <div class="msg-text"><p>${t.msg}</p></div>
      ${t.doc ? `<details class="doc" open><summary>Attachment: ${t.doc.title}</summary><div class="doc-in">${t.doc.html}</div></details>` : ""}
      <div class="ask">${t.ask}</div>
      <div id="widget"></div>
      <div id="res"></div>
    </div>
    <div class="foot" id="foot"><button class="btn orange sm" type="button" id="hintB">Ask ${job.mentor.name.split(" ")[0]}${hintCost ? ` (${hintCost}%)` : " (free)"}</button><span class="warn" id="warn"></span><span style="flex:1"></span><button class="btn go" type="button" id="subB">Submit</button></div>`;
  let finished = false, hinted = false;
  const ctx = {
    finish(ok, msg) {
      if (finished) return; finished = true; clearInterval(SH.timer);
      const xpGain = ok ? Math.round(t.tier * 10 * SH.diff.xp * (q.urgent ? 2 : 1)) : 2;
      SH.xp += xpGain; $("#xpN").textContent = "+" + SH.xp;
      SH.results[SH.i] = { ok, t, urgent: q.urgent };
      if (ok && q.urgent) SH.bonus += 25;
      setPerf(ok ? SH.diff.right + (q.urgent ? 4 : 0) : SH.diff.wrong);
      SH.js.done[t.id] = ok ? "ok" : (SH.js.done[t.id] === "ok" ? "ok" : "fail"); SH.js.lessons[t.id] = true; save();
      if (ok) Sfx.ok(); else { Sfx.bad(); win.classList.remove("shake"); void win.offsetWidth; if (!REDUCED) win.classList.add("shake"); }
      $("#foot").innerHTML = `<span class="small">+${xpGain} XP</span><span style="flex:1"></span><button class="btn go" type="button" id="nextB">${SH.perf <= 0 ? "Uh oh…" : SH.i + 1 >= SH.queue.length ? "Finish shift" : "Next task"}</button>`;
      $("#res").innerHTML = `<div class="result ${ok ? "good" : "bad"}"><h3>${ok ? pick(["Nice work!", "Nailed it!", "Great job!", "Solid!"]) : pick(["Oops, that's a mistake", "Not quite", "That didn't go well"])}</h3><div>${msg || ""}</div><div class="lesson"><b>What you learned:</b> ${t.lesson}</div></div>`;
      mentorSay(ok ? pick(["That's how it's done.", "You're picking this up fast!", "Exactly what I would have done.", "See? You're a natural."]) : pick(["Don't sweat it. Read the lesson; you'll get it next time.", "Everyone makes that mistake once. Now you know.", "That one's tricky. Remember it for next time.", "Mistakes are how you learn this job. Shake it off."]));
      const nb = $("#nextB"), born = Date.now(); nb.addEventListener("click", () => { if (Date.now() - born > 400) nextTask(); }); setTimeout(() => nb.isConnected && nb.focus(), 450);
      drawInbox();
    }
  };
  const w = W[t.type]($("#widget"), t, ctx);
  if (w.noSubmit) $("#subB").remove();
  else $("#subB").addEventListener("click", () => {
    const r = w.submit(); if (r.incomplete) { $("#warn").textContent = r.incomplete; Sfx.bad(); return; }
    ctx.finish(r.ok, r.msg);
  });
  $("#hintB").addEventListener("click", () => {
    if (finished) return;
    mentorSay(t.hint); Sfx.click();
    if (!hinted && hintCost) { setPerf(hintCost); } hinted = true;
    $("#hintB").disabled = true;
  });
  if (limit) {
    const t0 = Date.now(); let last = limit;
    SH.timer = setInterval(() => {
      const el = $("#tmr"); if (!el) { clearInterval(SH.timer); return; }
      const left = Math.max(0, Math.ceil(limit - (Date.now() - t0) / 1000));
      if (left !== last) { last = left; el.textContent = left + "s"; if (left <= 10) Sfx.tick(); }
      if (left <= 0) ctx.finish(false, "Time ran out. The problem got escalated over your head.");
    }, 250);
  }
  if (q.urgent) mentorSay("This one's urgent. Stay calm, read carefully, then act.");
}
function nextTask() {
  if (SH.perf <= 0) { SH.sentHome = true; return endShift(); }
  if (!SH.curveDone && SH.i === 1 && Math.random() < SH.diff.curve) {
    SH.curveDone = true;
    const seen = new Set(SH.queue.map(q => q.t.id));
    const cands = SH.job.tasks.filter(t => t.curveball && !seen.has(t.id));
    const fallback = SH.job.tasks.filter(t => t.tier === 3 && !seen.has(t.id));
    const c = pick(cands.length ? cands : fallback);
    if (c) {
      SH.queue.splice(SH.i + 1, 0, { t: c, urgent: true });
      const n = $("#notif"); $("#notifBody").innerHTML = `<b>${esc(c.from[0])}:</b> ${c.subject.replace(/^URGENT:\s*/, "")}`;
      n.classList.add("show"); Sfx.alarm(); setTimeout(() => n.classList.remove("show"), 3800);
      $(".taskbar span:nth-child(2)").textContent = `${SH.job.dept}: ${SH.queue.length} tasks today`;
    }
  }
  SH.i++;
  if (SH.i >= SH.queue.length) return endShift();
  drawInbox(); openTask();
  window.scrollTo({ top: Math.min(window.scrollY, $("#win").getBoundingClientRect().top + window.scrollY - 10), behavior: REDUCED ? "auto" : "smooth" });
}
function endShift() {
  clearInterval(SH.timer);
  const { job, js } = SH;
  const right = SH.results.filter(r => r && r.ok).length, wrong = SH.results.filter(r => r && !r.ok).length;
  const before = lvl(js.xp);
  const lvlNow = LEVELS[before];
  const pay = SH.sentHome ? Math.round(lvlNow.pay * .3) : Math.round(lvlNow.pay * SH.diff.pay * (.5 + SH.perf / 200)) + SH.bonus;
  const st = SH.sentHome ? 1 : starsFor(SH.perf);
  js.xp += SH.xp; js.days++; js.best = Math.max(js.best || 0, st); S.money += pay; save();
  const after = lvl(js.xp); const promoted = after > before;
  const learned = SH.results.filter(Boolean).map(r => r.t);
  app.innerHTML = `<div class="wrap"><div class="panel review"><div class="bar" style="--blue:${job.color}">End of shift report: ${job.dept}, day ${js.days}</div>
    <div class="rv-body">
      <div class="stamp ${SH.sentHome ? "badday" : ""}">${SH.sentHome ? "SENT HOME EARLY" : "SHIFT COMPLETE"}</div>
      <div style="font-size:30px">${stars(st)}</div>
      <p style="margin:0;max-width:46ch">${SH.sentHome ? `${job.mentor.name.split(" ")[0]} sent you home to reset. Tough day, but every mistake taught you something. Come back tomorrow.` : st >= 4 ? `${job.mentor.name.split(" ")[0]}: "Outstanding work today. Keep this up and you'll be running this place."` : st >= 3 ? `${job.mentor.name.split(" ")[0]}: "Good day. A few slips, but you're learning fast."` : `${job.mentor.name.split(" ")[0]}: "Rough one. Read your journal tonight and you'll do better tomorrow."`}</p>
      ${promoted ? `<div class="promo">PROMOTED! You're now ${titleFor(job, js.xp)}</div>` : ""}
      <table class="rv-table"><tr><td>Tasks done right</td><td style="color:var(--ok)">${right}</td></tr><tr><td>Mistakes</td><td style="color:var(--bad)">${wrong}</td></tr>
        <tr><td>Final performance</td><td>${SH.perf}%</td></tr><tr><td>XP earned</td><td>+${SH.xp}</td></tr>${SH.bonus ? `<tr><td>Urgent task bonus</td><td>${money(SH.bonus)}</td></tr>` : ""}<tr><td>Paycheck</td><td class="money">${money(pay)}</td></tr></table>
      <div class="lessons"><span class="lbl">What you learned today</span>${learned.map(t => `<div class="lesson"><b>${t.subject}:</b> ${t.lesson}</div>`).join("")}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn go big" type="button" id="again">Next shift</button><button class="btn" type="button" id="lob">Back to the lobby</button></div>
    </div></div></div>`;
  window.scrollTo(0, 0);
  if (promoted) { Sfx.promo(); setTimeout(() => Sfx.cash(), 900); } else Sfx.cash();
  const id = job.id; SH = null;
  $("#again").addEventListener("click", () => { Sfx.ok(); startShift(id); });
  $("#lob").addEventListener("click", showLobby);
}

showTitle();
})();
</script>
